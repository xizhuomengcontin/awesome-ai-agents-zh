title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        建议先从要解决的问题出发。形成明确执行项后，维护者可以把讨论转为 Issue。
  - type: textarea
    id: problem
    attributes:
      label: 现在有什么问题
      description: 谁会遇到这个问题？目前为什么难以解决？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
      description: 说明最小可行改进，以及怎样判断它有效。
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: 可能的成本或替代方案
      description: 可选。说明维护成本、风险或更简单的替代方式。
    validations:
      required: false
  - type: checkboxes
    id: duplicate
    attributes:
      label: 发布前确认
      options:
        - label: 我已搜索 Discussions 和 Issues，没有找到相同建议。
          required: true
